<svg viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .box-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .box-text { font-family: Arial, sans-serif; font-size: 13px; }
      .arrow { stroke: #2f2f2f; stroke-width: 3; }
    </style>
  </defs>

  <rect width="760" height="760" fill="#ffffff"/>

  <!-- Einheitlicher Hauptfluss -->
  <rect x="140" y="84" width="480" height="92" rx="12" fill="#ff6b6b" stroke="#2f2f2f" stroke-width="2"/>
  <text x="380" y="116" class="box-title" text-anchor="middle" fill="#ffffff">1. Fehler in Struct</text>
  <text x="380" y="138" class="box-text" text-anchor="middle" fill="#ffffff">Typname oder Praefix verletzt Coding-Convention</text>
  <text x="380" y="156" class="box-text" text-anchor="middle" fill="#ffffff">Deklaration fachlich nicht regelkonform</text>

  <line x1="380" y1="176" x2="380" y2="206" class="arrow"/>
  <polygon points="380,206 372,193 388,193" fill="#2f2f2f"/>

  <rect x="140" y="206" width="480" height="92" rx="12" fill="#ffd93d" stroke="#2f2f2f" stroke-width="2"/>
  <text x="380" y="238" class="box-title" text-anchor="middle" fill="#1a1a1a">2. Copilot erkennt den Verstoß</text>
  <text x="380" y="260" class="box-text" text-anchor="middle" fill="#1a1a1a">Review-Kommentar wird korrekt erzeugt</text>
  <text x="380" y="278" class="box-text" text-anchor="middle" fill="#1a1a1a">auf Basis der Rule-Instructions</text>

  <line x1="380" y1="298" x2="380" y2="328" class="arrow"/>
  <polygon points="380,328 372,315 388,315" fill="#2f2f2f"/>

  <rect x="140" y="328" width="480" height="92" rx="12" fill="#a78bfa" stroke="#2f2f2f" stroke-width="2"/>
  <text x="380" y="360" class="box-title" text-anchor="middle" fill="#ffffff">3. GitHub unterdrueckt Kommentar</text>
  <text x="380" y="382" class="box-text" text-anchor="middle" fill="#ffffff">Umbenannte DUT-Datei fuehrt zu unsicherem Diff-Kontext</text>
  <text x="380" y="400" class="box-text" text-anchor="middle" fill="#ffffff">Status: "suppressed due to uncertainty"</text>

  <line x1="380" y1="420" x2="380" y2="450" class="arrow"/>
  <polygon points="380,450 372,437 388,437" fill="#2f2f2f"/>

  <rect x="140" y="450" width="480" height="92" rx="12" fill="#4dabf7" stroke="#2f2f2f" stroke-width="2"/>
  <text x="380" y="482" class="box-title" text-anchor="middle" fill="#ffffff">4. Anti-Suppression-Gegenmaßnahme</text>
  <text x="380" y="504" class="box-text" text-anchor="middle" fill="#ffffff">Zusaetzliche Fundstelle in stabiler Datei melden</text>
  <text x="380" y="522" class="box-text" text-anchor="middle" fill="#ffffff">erste Verwendung oder .plcproj (+ Zeile)</text>

  <line x1="380" y1="542" x2="380" y2="572" class="arrow"/>
  <polygon points="380,572 372,559 388,559" fill="#2f2f2f"/>

  <rect x="140" y="572" width="480" height="92" rx="12" fill="#51cf66" stroke="#2f2f2f" stroke-width="2"/>
  <text x="380" y="604" class="box-title" text-anchor="middle" fill="#1a1a1a">5. Sichtbarer doppelter Report</text>
  <text x="380" y="626" class="box-text" text-anchor="middle" fill="#1a1a1a">Befund an Deklaration und zusaetzlicher Fundstelle im PR</text>
  <text x="380" y="644" class="box-text" text-anchor="middle" fill="#1a1a1a">Verstoß bleibt trotz Rename sichtbar</text>
</svg>